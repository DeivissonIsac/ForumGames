<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForumGames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">
    {% block head %}
    {% endblock %}

    <!--
        Script para fazer as mensagens de alerta sumirem depois de 3 segundos.
    -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                // Mostrar o alerta após um pequeno atraso
                setTimeout(() => {
                    alert.classList.add('show-alert');
                }, 100);

                // Remover o alerta após 3 segundos e 0.5s para a animação de saída
                setTimeout(() => {
                    alert.classList.remove('show-alert');

                    // Remover do DOM após a transição
                    alert.addEventListener('transitionend', () => {
                        alert.remove();
                    });
                }, 3500);
            });
        });
    </script>

</head>
<body style="background-color: #F8F8FF">
    {% include 'navbar.html' %}

    <!--
        Codigo de Alerta:
            Todos os alertas e suas categorias, são armazenados na variavel "mensagens", se tiver mensangens, a váriavel é iterada
            feito o unpacking em categoria e seu texto. Após isso é exibido a mensagem com estilo do bootstrap.
    -->
        {% with mensagens = get_flashed_messages(with_categories=True) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="alert {{ categoria }}">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}


    {% block body %}
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
